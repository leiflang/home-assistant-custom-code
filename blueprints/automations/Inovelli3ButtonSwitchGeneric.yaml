mode: restart
blueprint:
  name: Inovelli 3 button switch
  author: leiflang (modified from Skaronator's IKEA BILRESA Dual Button blueprint)
  description: |
    # Inovelli 3 button white series blueprint
    ## Version 1.0.0

    # Description
    To use this script you must link the 3 button events of your Inovelli smart switch in the Button Setup section. Unless you changed the event names they should match exactly with what is shown in the Button Section of this blueprint.
    After that you can setup the actions that will be performed by the smart button when the buttons are pressed. You DO NOT need to set up all actions, only the actions you plan to use!

    # Compatibility
    This blueprint is designed to work with the Inovelli white series switches.  
    Current this blueprint is known to work with the following switches.  
    - White Series Smart Dimmer (formerly 2-1 switch)  
    - White Series Smart Fan Switch  
    - White Series Smart On/Off Switch  

    # Change Log
    ### Version 1.0.0
    Initial Version modified from [Skaronator's IKEA BILRESA Dual Button blueprint](https://github.com/Skaronator/home-assistant-blueprints/blob/main/automation/ikea-bilresa-dual-button.yaml)

    # Extra Info and Links
    [Skaronator's IKEA BILRESA Dual Button blueprint](https://github.com/Skaronator/home-assistant-blueprints/blob/main/automation/ikea-bilresa-dual-button.yaml)
    [Copyright License](https://github.com/leiflang/home-assistant-custom-code/blob/main/LICENSE.txt)
    [GitHub](https://github.com/leiflang/home-assistant-custom-code/blob/main/blueprints/automations/Inovelli3ButtonSwitchGeneric.yaml)  

    Thank you for downloading this script!
  domain: automation
  source_url: https://raw.githubusercontent.com/leiflang/home-assistant-custom-code/refs/heads/main/blueprints/automations/Inovelli3ButtonSwitchGeneric.yaml
  homeassistant:
    min_version: 2025.12.0
  input:
    setup:
      name: ⚙️ Button Setup
      description: "Select the button events for the switch or switches. You can select multiple button events if you want more then one button or switch to perform the same actions."
      collapsed: true
      input:
        button_up_event:
          name: Button (Up)
          description: "Select the 'Button (Up)' Event for your switch or switches"
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - event
                  device_class:
                    - button
              reorder: false
        button_down_event:
          name: Button (Down)
          description: "Select the 'Button (Down)' Event for your switch or switches"
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - event
                  device_class:
                    - button
              reorder: false
        button_config_event:
          name: Button (Config)
          description: "Select the 'Button (Config)' Event for your switch or switches"
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - event
                  device_class:
                    - button
              reorder: false
        button_holding_interval:
          name: Holding Interval (seconds)
          description: Interval in seconds for repeating "while holding" actions.
          default: 0.2
          selector:
            number:
              min: 0.05
              max: 2.0
              step: 0.05
              mode: slider
        button_holding_max_iterations:
          name: Holding Max Iterations
          description:
            Maximum number of iterations for "while holding" actions. This
            is a safety limit to prevent infinite loops.
          default: 100
          selector:
            number:
              min: 1.0
              max: 1000.0
              step: 1.0
              mode: slider
    button1:
      name: "⬆️ Button (Up) Actions

        "
      description: "Define actions when pressing Button (Up).

        "
      collapsed: true
      input:
        button1_single:
          name: Single Press
          description: Action for Button (Up) single press.
          default: []
          selector:
            action: {}
        button1_double:
          name: Double Press
          description: Action for Button (Up) double press.
          default: []
          selector:
            action: {}
        button1_long_press:
          name: Long Press (on press)
          description: Action for Button (Up) long press completion.
          default: []
          selector:
            action: {}
        button1_long_release:
          name: Long Press (on release)
          description: Action for Button (Up) long press completion.
          default: []
          selector:
            action: {}
        button1_while_holding:
          name: While Holding
          description:
            Action for Button (Up) while holding. This action will be repeated
            at the defined interval while the button is held down.
          default: []
          selector:
            action: {}
    button2:
      name: "⬇️ Button (Down) Actions

        "
      description: "Define actions when pressing Button (Down).

        "
      collapsed: true
      input:
        button2_single:
          name: Single Press
          description: Action for Button (Down) single press.
          default: []
          selector:
            action: {}
        button2_double:
          name: Double Press
          description: Action for Button (Down) double press.
          default: []
          selector:
            action: {}
        button2_long_press:
          name: Long Press (on press)
          description: Action for Button (Down) long press completion.
          default: []
          selector:
            action: {}
        button2_long_release:
          name: Long Press (on release)
          description: Action for Button (Down) long press completion.
          default: []
          selector:
            action: {}
        button2_while_holding:
          name: While Holding
          description:
            Action for Button (Down) while holding. This action will be repeated
            at the defined interval while the button is held down.
          default: []
          selector:
            action: {}
    buttonConfig:
      name: "🔃 Button (Config) Actions

        "
      description: "Define actions when pressing Button (Config).

        "
      collapsed: true
      input:
        buttonConfig_single:
          name: Single Press
          description: Action for Button (Config) single press.
          default: []
          selector:
            action: {}
        buttonConfig_double:
          name: Double Press
          description: Action for Button (Config) double press.
          default: []
          selector:
            action: {}
        buttonConfig_long_press:
          name: Long Press (on press)
          description: Action for Button (Config) long press completion.
          default: []
          selector:
            action: {}
        buttonConfig_long_release:
          name: Long Press (on release)
          description: Action for Button (Config) long press completion.
          default: []
          selector:
            action: {}
        buttonConfig_while_holding:
          name: While Holding
          description:
            Action for Button (Config) while holding. This action will be repeated
            at the defined interval while the button is held down.
          default: []
          selector:
            action: {}
trigger:
  - platform: state
    id: button1
    entity_id: !input button_up_event
  - platform: state
    id: button2
    entity_id: !input button_down_event
  - platform: state
    id: buttonConfig
    entity_id: !input button_config_event
condition:
  - condition: template
    value_template:
      "{{ trigger.from_state.state not in ['unknown', 'unavailable']
      }}

      "
  - condition: template
    value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable']
      }}

      "
  - condition: template
    value_template: "{{ trigger.from_state.state != trigger.to_state.state }}

      "
action:
  - variables:
      trigger_id: "{{ trigger.id }}"
      press_type: "{{ trigger.to_state.attributes.event_type }}"
      button_max_iterations: !input button_holding_max_iterations
  - parallel:
      - repeat:
          while:
            - condition: template
              value_template:
                "{{ press_type == 'long_press' and trigger_id == 'button1'
                and states(trigger.entity_id) == trigger.to_state.state }}

                "
            - condition: template
              value_template:
                "{{ repeat.index|default(0) <= button_max_iterations }}

                "
          sequence:
            - sequence: !input button1_while_holding
            - delay:
                seconds: !input button_holding_interval
      - repeat:
          while:
            - condition: template
              value_template:
                "{{ press_type == 'long_press' and trigger_id == 'button2'
                and states(trigger.entity_id) == trigger.to_state.state }}

                "
            - condition: template
              value_template:
                "{{ repeat.index|default(0) <= button_max_iterations }}

                "
          sequence:
            - sequence: !input button2_while_holding
            - delay:
                seconds: !input button_holding_interval
      - repeat:
          while:
            - condition: template
              value_template:
                "{{ press_type == 'long_press' and trigger_id == 'buttonConfig'
                and states(trigger.entity_id) == trigger.to_state.state }}

                "
            - condition: template
              value_template:
                "{{ repeat.index|default(0) <= button_max_iterations }}

                "
          sequence:
            - sequence: !input buttonConfig_while_holding
            - delay:
                seconds: !input button_holding_interval
      - choose:
          - conditions:
              - condition: template
                value_template:
                  "{{ trigger_id == 'button1' and press_type == 'multi_press_1'
                  }}

                  "
            sequence: !input button1_single
          - conditions:
              - condition: template
                value_template:
                  "{{ trigger_id == 'button1' and press_type == 'multi_press_2'
                  }}

                  "
            sequence: !input button1_double
          - conditions:
              - condition: template
                value_template:
                  "{{ trigger_id == 'button1' and press_type == 'long_press'
                  }}

                  "
            sequence: !input button1_long_press
          - conditions:
              - condition: template
                value_template:
                  "{{ trigger_id == 'button1' and press_type == 'long_release'
                  }}

                  "
            sequence: !input button1_long_release
          - conditions:
              - condition: template
                value_template:
                  "{{ trigger_id == 'button2' and press_type == 'multi_press_1'
                  }}

                  "
            sequence: !input button2_single
          - conditions:
              - condition: template
                value_template:
                  "{{ trigger_id == 'button2' and press_type == 'multi_press_2'
                  }}

                  "
            sequence: !input button2_double
          - conditions:
              - condition: template
                value_template:
                  "{{ trigger_id == 'button2' and press_type == 'long_press'
                  }}

                  "
            sequence: !input button2_long_press
          - conditions:
              - condition: template
                value_template:
                  "{{ trigger_id == 'button2' and press_type == 'long_release'
                  }}

                  "
            sequence: !input button2_long_release
          - conditions:
              - condition: template
                value_template:
                  "{{ trigger_id == 'buttonConfig' and press_type == 'multi_press_1'
                  }}

                  "
            sequence: !input buttonConfig_single
          - conditions:
              - condition: template
                value_template:
                  "{{ trigger_id == 'buttonConfig' and press_type == 'multi_press_2'
                  }}

                  "
            sequence: !input buttonConfig_double
          - conditions:
              - condition: template
                value_template:
                  "{{ trigger_id == 'buttonConfig' and press_type == 'long_press'
                  }}

                  "
            sequence: !input buttonConfig_long_press
          - conditions:
              - condition: template
                value_template:
                  "{{ trigger_id == 'buttonConfig' and press_type == 'long_release'
                  }}

                  "
            sequence: !input buttonConfig_long_release
